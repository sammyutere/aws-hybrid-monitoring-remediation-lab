global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 30m
  receiver: default-ticket

  routes:
    - matchers:
        - severity="critical"
      receiver: critical-receiver

    - matchers:
        - severity="page"
      receiver: page-receiver

    - matchers:
        - severity="ticket"
      receiver: ticket-receiver

receivers:
  - name: default-ticket
    webhook_configs:
      - url: http://test-receiver:5001/default
        send_resolved: true

  - name: critical-receiver
    webhook_configs:
      - url: http://test-receiver:5001/critical
        send_resolved: true

  - name: page-receiver
    webhook_configs:
      - url: http://test-receiver:5001/page
        send_resolved: true

  - name: ticket-receiver
    webhook_configs:
      - url: http://test-receiver:5001/ticket
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="page"
    equal:
      - alertname
      - job
      - instance

  - source_matchers:
      - severity="page"
    target_matchers:
      - severity="ticket"
    equal:
      - job
      - instance
