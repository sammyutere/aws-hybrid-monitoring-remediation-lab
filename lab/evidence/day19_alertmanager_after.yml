global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 30m
  receiver: default-ticket

  routes:
    - matchers:
        - severity="critical"
      receiver: critical-webhook

    - matchers:
        - severity="page"
      receiver: page-webhook

    - matchers:
        - severity="ticket"
      receiver: ticket-webhook

receivers:
  - name: default-ticket
    webhook_configs:
      - url: http://host.docker.internal:5001/default
        send_resolved: true

  - name: critical-webhook
    webhook_configs:
      - url: http://host.docker.internal:5001/critical
        send_resolved: true

  - name: page-webhook
    webhook_configs:
      - url: http://host.docker.internal:5001/page
        send_resolved: true

  - name: ticket-webhook
    webhook_configs:
      - url: http://host.docker.internal:5001/ticket
        send_resolved: true
